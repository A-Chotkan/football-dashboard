<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Dashboard</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Eigen CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-trophy-fill text-warning"></i>
                Football Dashboard
            </a>
        </div>
    </nav>

    <!-- HEADER -->
    <header class="py-5 text-center">
        <h1 class="display-4 fw-bold text-white">⚽ Football Dashboard</h1>
        <p class="text-secondary fs-5">Bekijk actuele voetbalstanden</p>
    </header>

    <!-- COMPETITIE KIEZER -->
    <div class="container mb-4">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <select class="form-select" id="leagueSelect">
                    <option>Eredivisie</option>
                    <option>Premier League</option>
                    <option>La Liga</option>
                    <option>Bundesliga</option>
                    <option>Serie A</option>
                </select>
            </div>
        </div>
    </div>

    <!-- STANDEN -->
    <main class="container">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white fw-bold">
                <i class="bi bi-table"></i>
                Standen
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Team</th>
                                <th>GS</th>
                                <th>W</th>
                                <th>G</th>
                                <th>V</th>
                                <th>P</th>
                            </tr>
                        </thead>
                        <tbody id="standings"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center text-secondary py-4 mt-5">
        <p class="mb-0">
            © 2026 Football Dashboard | Gemaakt door Aditya Chotkan
        </p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
